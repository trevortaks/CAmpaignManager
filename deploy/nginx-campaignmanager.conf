# Reverse proxy for CampaignManager. Adjust server_names, then:
#   sudo cp deploy/nginx-campaignmanager.conf /etc/nginx/sites-available/campaignmanager
#   sudo ln -s /etc/nginx/sites-available/campaignmanager /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Run `certbot --nginx` afterwards to add TLS for both server blocks.

server {
    listen 80;
    server_name api.example.com;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name admin.example.com;

    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Workers (127.0.0.1:5090) exposes /metrics and Hangfire's dashboard only — not routed here
# on purpose. Reach it via SSH tunnel, or add a location block with IP allowlisting if needed.
